name: Publish to npm

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org

      - name: Verify release target and metadata
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor HEAD origin/main
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";
          const pkg = JSON.parse(readFileSync("package.json", "utf8"));
          const lock = JSON.parse(readFileSync("package-lock.json", "utf8"));
          const server = JSON.parse(readFileSync("server.json", "utf8"));
          const expectedTag = `v${pkg.version}`;
          const packageMetadata = server.packages?.[0];
          const errors = [];
          if (process.env.RELEASE_TAG !== expectedTag) errors.push(`release tag ${process.env.RELEASE_TAG} != ${expectedTag}`);
          if (lock.packages?.[""]?.version !== pkg.version) errors.push("package-lock root version != npm version");
          if (pkg.mcpName !== server.name) errors.push("package.json mcpName != server.json name");
          if (server.version !== pkg.version) errors.push("server version != npm version");
          if (packageMetadata?.version !== pkg.version) errors.push("Registry package version != npm version");
          if (packageMetadata?.identifier !== pkg.name) errors.push("Registry package identifier != npm package name");
          if (errors.length > 0) {
            console.error(errors.join("\n"));
            process.exit(1);
          }
          NODE

      - name: Install dependencies
        run: npm ci

      # npm Trusted Publishing (OIDC) requires npm >= 11.5.1. Pin a known-good
      # CLI instead of npm@latest: npm/cli#9151 documents incomplete global
      # self-upgrades that can leave provenance dependencies unavailable.
      - name: Ensure npm >= 11.5.1 (required for OIDC trusted publishing)
        run: npm install -g npm@11.11.0

      # No NPM_TOKEN — npm exchanges this workflow's OIDC token for a short-lived
      # publish credential. Requires the package's Trusted Publisher to be
      # configured on npmjs.com first (see README). npm publish invokes the
      # package's prepublishOnly gate exactly once.
      - name: Publish to npm (OIDC trusted publishing)
        run: npm publish --access public
