name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  windows-smoke:
    name: Windows CLI and stdio smoke (Node 24)
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: CLI version and help
        shell: pwsh
        run: |
          node dist/cli.js --version
          if ($LASTEXITCODE -ne 0) { throw "CLI version failed" }
          node dist/cli.js --help
          if ($LASTEXITCODE -ne 0) { throw "CLI help failed" }

      - name: Offline diagnostics without credentials
        shell: pwsh
        env:
          GITHUB_TOKEN: ""
          GITHUB_OWNER: ""
          GITHUB_REPO: ""
        run: |
          $report = node dist/cli.js doctor --json | ConvertFrom-Json
          if ($LASTEXITCODE -ne 2 -or $report.credentialPresent -or $report.status -ne "needs_configuration") {
            throw "Offline diagnostics did not preserve missing-credential semantics"
          }
          exit 0

      - name: Stdio and configuration lifecycle
        run: npx vitest run src/__tests__/config.integration.test.ts src/__tests__/mcp-stdio-process.integration.test.ts

      - name: MCP smoke
        run: npm run smoke

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check line endings
        run: npm run check:line-endings

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Check MCP contract compatibility
        run: node scripts/check-mcp-contract.mjs

      - name: Test
        run: npm run test

      - name: Smoke test
        run: npm run smoke

      - name: Coverage
        run: npm run test:coverage

      - name: Upload coverage artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-node-${{ matrix.node-version }}
          path: coverage/
          retention-days: 14

  contract-baseline:
    name: Contract baseline (Node 24)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout with release tags
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Replay immutable v1.9.0 baseline
        run: node scripts/verify-mcp-baseline.mjs

  inspector-stdio-contract:
    name: Contract and evaluation (Node 24)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout with release tags
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            tools/inspector/package-lock.json
            tools/conformance/package-lock.json

      - name: Install product dependencies
        run: npm ci

      - name: Install pinned Inspector without lifecycle scripts
        run: npm run contracts:inspector:install

      - name: Install pinned Conformance runner without lifecycle scripts
        run: npm run contracts:conformance:install

      - name: Check current MCP manifest
        run: npm run contracts:check

      - name: Verify stdio through Inspector 2
        run: npm run contracts:inspector:stdio

      - name: Verify loopback HTTP through Inspector 2
        run: npm run contracts:inspector:http

      - name: Run legacy MCP Conformance pilot
        run: npm run contracts:conformance:pilot

      - name: Run deterministic evaluation release gate
        run: npm run eval:ci

      - name: Upload sanitized contract and evaluation evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: v1.10-contract-evaluation-node-24
          path: |
            artifacts/contracts/manifest-diff.json
            artifacts/conformance/v0.1.16/checks.json
            artifacts/evaluation/scenario-score.json
            artifacts/evaluation/budgets.json
            artifacts/evaluation/faults.json
          if-no-files-found: error
          retention-days: 14
